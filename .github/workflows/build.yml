name: Vertex Auto-Build ROM

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Dán đường link tải ROM vào đây'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Giải phóng dung lượng đĩa
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 3. Thiết lập môi trường và công cụ
        run: |
          sudo apt update
          sudo apt install -y curl wget git zip unzip python3 python3-pip rclone aria2
          pip3 install --upgrade pip

      - name: 4. Tải và bung ROM
        env:
          ROM_URL: ${{ github.event.inputs.rom_url }}
        run: |
          chmod +x scripts/*.sh || true
          
          # Tự động trích xuất tên file gốc từ đường link URL
          ORIGINAL_NAME=$(basename "${ROM_URL%%\?*}")
          if [ -z "$ORIGINAL_NAME" ] || [[ "$ORIGINAL_NAME" != *.zip ]]; then
            ORIGINAL_NAME="ROM_$(date +%Y%m%d_%H%M%S).zip"
          fi
          echo "ROM_FILENAME=$ORIGINAL_NAME" >> $GITHUB_ENV
          echo "Tên file ROM gốc: $ORIGINAL_NAME"

          if [ -f "scripts/download.sh" ]; then
            bash scripts/download.sh "$ROM_URL" "$ORIGINAL_NAME"
          else
            echo "Đang tải ROM với tên gốc..."
            aria2c -x 16 -s 16 -k 1M "$ROM_URL" -o "$ORIGINAL_NAME"
          fi

      - name: 5. Chạy Script Tinh Chỉnh & Debloat
        run: |
          if [ -f "scripts/modify.sh" ]; then
            bash scripts/modify.sh
          fi

      - name: 6. Đóng gói ROM
        run: |
          if [ -f "scripts/pack.sh" ]; then
            bash scripts/pack.sh
          fi

      - name: 7. Đẩy ROM lên Google Drive qua Rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          # Tìm file zip thành phẩm mới nhất tạo ra (loại trừ file tải ban đầu nếu có)
          TARGET_FILE=$(find . -maxdepth 2 -name "*.zip" ! -name "$ROM_FILENAME" | head -n 1)

          # Nếu không tạo ra file mới (ghi đè vào file gốc), lấy luôn file gốc
          if [ -z "$TARGET_FILE" ]; then
            TARGET_FILE="$ROM_FILENAME"
          fi

          if [ -f "$TARGET_FILE" ]; then
            # Đổi tên file xuất ra có tiền tố Vertex_ và giữ nguyên tên ROM gốc
            FINAL_NAME="Vertex_${ROM_FILENAME}"
            if [ "$TARGET_FILE" != "$FINAL_NAME" ]; then
              mv "$TARGET_FILE" "$FINAL_NAME"
            fi
            
            echo "Đang upload $FINAL_NAME lên Google Drive..."
            rclone copy "$FINAL_NAME" gdrive:/ROM_Builds/ -P
          else
            echo "Lỗi: Không tìm thấy file ZIP thành phẩm!"
            exit 1
          fi
